[project]
name = "enterprise-retail-data-platform"
version = "0.1.0"
description = "Enterprise Retail Data Platform using Snowflake, dbt, Airflow, PySpark and AWS"
requires-python = ">=3.14"
authors = [
    { name = "Anup Singh" }
]
dependencies = [
    "black>=26.5.1",
    "faker>=40.36.0",
    "mypy>=2.3.0",
    "pandas>=3.0.5",
    "pre-commit>=4.6.1",
    "pyarrow>=25.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.1",
]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
